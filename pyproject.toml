[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "battryml"
version = "0.1.0"
description = "Local modular battery analytics platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary - All rights reserved"}
classifiers = [
  "License :: Other/Proprietary License",
]
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "pyarrow>=15,<22",
  "pytz>=2024,<2027",
  "python-dotenv>=1,<2",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
battryml = "battryml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/battryml"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
